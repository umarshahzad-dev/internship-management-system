version: '3.8'

services:
  postgres:
    image: postgres:latest
    container_name: imas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: imas
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:latest
    container_name: imas-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  postgres_data: